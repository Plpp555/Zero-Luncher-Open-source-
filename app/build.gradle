plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.plpp555.zerolauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.plpp555.zerolauncher'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installable out of the box; replace with your own key for distribution.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }

    // No dependency metadata block in the APK (there are no dependencies anyway).
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Tests only; the APK has no dependencies.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
